<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>先行案内 ご注文｜円山屋</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f1ed; color: #222; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 170px; }
  .kicker { font-size: 12px; color: #7a1f2b; font-weight: bold; letter-spacing: 1px; }
  h1 { font-size: 20px; margin: 4px 0 6px; line-height: 1.4; }
  .lead { font-size: 13px; color: #555; line-height: 1.7; margin: 0 0 12px; }
  .notice { background: #f7f2ea; border-left: 4px solid #7a1f2b; padding: 10px 12px; font-size: 13px; line-height: 1.7; margin-bottom: 14px; }
  .item { background: #fff; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  .item.on { outline: 2px solid #7a1f2b; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: bold; font-size: 15px; line-height: 1.4; }
  .type { font-size: 12px; color: #b8640b; }
  .price { font-size: 13px; color: #666; margin-top: 2px; }
  .price b { color: #c00000; font-size: 16px; }
  .stepper { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .stepper button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #7a1f2b; background: #fff; color: #7a1f2b; font-size: 22px; line-height: 1; padding: 0; }
  .stepper button.plus { background: #7a1f2b; color: #fff; }
  .stepper button:disabled { opacity: .3; }
  .qty { width: 32px; text-align: center; font-size: 19px; font-weight: bold; }
  .six { margin-top: 6px; font-size: 13px; border: none; background: none; color: #7a1f2b; text-decoration: underline; padding: 0; }
  label { display: block; font-size: 13px; font-weight: bold; margin: 14px 0 4px; }
  .req { display: inline-block; margin-left: 4px; padding: 0 6px; font-size: 11px; color: #fff; background: #c00000; border-radius: 3px; vertical-align: 1px; }
  input, select, textarea { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; background: #fff; font-family: inherit; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #e5e0d8; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 560px; margin: 0 auto; }
  .sum { display: flex; justify-content: space-between; align-items: baseline; }
  .sum .n { font-size: 18px; font-weight: bold; }
  .sum .y { font-size: 18px; font-weight: bold; color: #c00000; }
  .sub { font-size: 12px; color: #666; text-align: right; }
  .hint { font-size: 12px; color: #7a1f2b; margin-top: 2px; min-height: 16px; }
  .go { width: 100%; margin-top: 8px; padding: 14px; font-size: 17px; font-weight: bold; color: #fff; background: #7a1f2b; border: none; border-radius: 8px; }
  .go:disabled { background: #bbb; }
  .msg { background: #fff; border-radius: 8px; padding: 24px 18px; margin-top: 24px; line-height: 1.8; text-align: center; }
  .err { color: #c00000; font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">読み込み中です…</div></div>
<div class="bar" id="bar" hidden>
  <div class="in">
    <div class="sum"><span class="n" id="total">合計 0本</span><span class="y" id="amount">¥0</span></div>
    <div class="sub" id="tax">税抜（税込 ¥0）</div>
    <div class="hint" id="hint"></div>
    <button class="go" id="go" disabled>注文を確定する</button>
    <div class="err" id="err"></div>
  </div>
</div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// 先行案内のデータは GAS から読む（案内が変わってもこのファイルは変えなくてよい）
// GAS は LINE のアクセストークンで本人を確かめ、承認済みの人にだけ商品と価格を返す
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyH4WPrqWzN4XOyD3ER7bEblq1OFKeWYI3YDfvCnPck8USBhiGTqlGyrcjqqr9qPcU/exec';
const LIFF_ID = '2012025548-wUHQPY1m';
const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const TIMES = ['指定なし', '午前中', '12〜14時', '14〜16時', '16〜18時'];
const app = document.getElementById('app');
const yen = n => '¥' + n.toLocaleString('ja-JP');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function message(html) {
  document.getElementById('bar').hidden = true;
  app.innerHTML = '<div class="msg">' + html + '</div>';
}

function remember(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key) || '';
    localStorage.setItem(key, value);
  } catch (e) {
    return '';
  }
}

main().catch(e => message('読み込みに失敗しました。<br>画面を閉じて、もう一度お試しください。<br><small>' + esc(e.message || e) + '</small>'));

async function main() {
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) return liff.login();
  const res = await fetch(GAS_URL + '?api=order&token=' + encodeURIComponent(liff.getAccessToken()));
  const cfg = await res.json();
  if (cfg.pending) return message('ご登録の確認が済み次第、ご覧いただけます。<br>確認ができましたら、LINEのトークでお知らせいたします。');
  if (cfg.error) return message('ご本人の確認ができませんでした。<br>LINEのトークで「先行販売」を押し、「注文する」から開き直してください。');
  if (!cfg.order) return message('現在ご案内中の先行販売はありません。');
  if (cfg.closed) return message('<b>' + esc(cfg.order.title) + '</b><br>ご予約の受付は終了しました。');
  render(cfg.order);
}

function render(o) {
  const qty = o.items.map(() => 0);
  const min = o.min || 1;
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);

  app.innerHTML =
    '<div class="kicker">先行案内 ご注文</div>' +
    '<h1>' + esc(o.title) + '</h1>' +
    (o.lead ? '<p class="lead">' + esc(o.lead) + '</p>' : '') +
    (o.notes && o.notes.length ? '<div class="notice">' + o.notes.map(esc).join('<br>') + '</div>' : '') +
    o.items.map((it, i) =>
      '<div class="item" id="row' + i + '"><div class="info">' +
        '<div class="name">' + (CIRCLED[i] || '') + ' ' + esc(it.name) + '</div>' +
        (it.type ? '<div class="type">' + esc(it.type) + '</div>' : '') +
        '<div class="price">納入 <b>' + yen(it.net) + '</b>' + (it.retail ? '　参考上代 ' + yen(it.retail) : '') + '</div>' +
        '<button class="six" data-six="' + i + '">＋6本</button>' +
      '</div><div class="stepper">' +
        '<button data-d="-1" data-i="' + i + '" aria-label="減らす">−</button>' +
        '<span class="qty" id="q' + i + '">0</span>' +
        '<button class="plus" data-d="1" data-i="' + i + '" aria-label="増やす">＋</button>' +
      '</div></div>').join('') +
    '<label for="shop">店舗名 <span class="req">必須</span></label><input id="shop" value="' + esc(remember('shop')) + '" placeholder="例）テップス">' +
    '<label for="date">納品希望日</label><input id="date" type="date" min="' + today + '">' +
    '<label for="time">時間帯</label><select id="time">' + TIMES.map(t => '<option>' + t + '</option>').join('') + '</select>' +
    '<label for="note">備考</label><textarea id="note" rows="2"></textarea>' +
    '<p class="lead" style="margin-top:12px">価格はすべて税抜です。</p>';
  document.getElementById('bar').hidden = false;

  app.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.six !== undefined) qty[b.dataset.six] += 6;
    else if (b.dataset.i !== undefined) qty[b.dataset.i] = Math.max(0, qty[b.dataset.i] + Number(b.dataset.d));
    else return;
    update();
  });
  document.getElementById('shop').addEventListener('input', update);

  function totals() {
    let total = 0, amount = 0;
    qty.forEach((q, i) => { total += q; amount += q * o.items[i].net; });
    return { total, amount };
  }

  function update() {
    qty.forEach((q, i) => {
      document.getElementById('q' + i).textContent = q;
      document.getElementById('row' + i).classList.toggle('on', q > 0);
      document.querySelector('[data-d="-1"][data-i="' + i + '"]').disabled = q === 0;
    });
    const { total, amount } = totals();
    const hasShop = document.getElementById('shop').value.trim() !== '';
    document.getElementById('total').textContent = '合計 ' + total + '本';
    document.getElementById('amount').textContent = yen(amount);
    document.getElementById('tax').textContent = '税抜（税込 ' + yen(Math.floor(amount * 1.1)) + '）';
    document.getElementById('hint').textContent =
      total === 0 ? '本数を選んでください' :
      total < min ? min + '本からご注文いただけます（あと' + (min - total) + '本）' :
      !hasShop ? '店舗名を入力すると注文できます' :
      o.freeShip && total < o.freeShip ? 'あと' + (o.freeShip - total) + '本で送料無料（混載' + o.freeShip + '本）' :
      o.freeShip ? '送料無料です' : '';
    document.getElementById('go').disabled = total < min || !hasShop;
  }
  update();

  document.getElementById('go').addEventListener('click', async () => {
    const err = document.getElementById('err');
    const go = document.getElementById('go');
    if (!liff.isInClient()) { err.textContent = 'LINEアプリの中で開いてください。'; return; }
    const shop = document.getElementById('shop').value.trim();
    const date = document.getElementById('date').value;
    const time = document.getElementById('time').value;
    const note = document.getElementById('note').value.replace(/\s+/g, ' ').trim();
    const { total, amount } = totals();
    const lines = o.items.map((it, i) => qty[i] ? (CIRCLED[i] || '') + it.name + ' × ' + qty[i] + '本' : '').filter(Boolean);
    if (!confirm('この内容で注文しますか？\n\n' + lines.join('\n') + '\n\n合計 ' + total + '本　' + yen(amount) + '（税抜）')) return;

    // トークに注文内容を送る。最後の #ORDER 行を GAS が読み取って受付する
    const text = '【注文】' + o.title + '\n' + lines.join('\n') +
      '\n合計 ' + total + '本 ' + yen(amount) + '（税抜）' +
      '\n店舗名：' + shop +
      '\n納品希望：' + (date || '指定なし') + (time !== '指定なし' ? ' ' + time : '') +
      (note ? '\n備考：' + note : '') +
      '\n#ORDER ' + o.id + ' ' + qty.join(',');
    go.disabled = true; go.textContent = '送信中…'; err.textContent = '';
    try {
      await liff.sendMessages([{ type: 'text', text: text }]);
      remember('shop', shop);
      message('<b>ご注文を送信しました</b><br>トークに受付のお知らせが届きます。');
      setTimeout(() => liff.closeWindow(), 1200);
    } catch (e) {
      err.textContent = '送信できませんでした：' + (e.message || e);
      go.disabled = false; go.textContent = '注文を確定する';
    }
  });
}
</script>
</body>
</html>
